# work-os 自身の宣言。このフレームワークはこのフレームワークに従う。

[repo]
name        = "work-os"
domain      = "meta"
role        = "kernel"
status      = "active"
enforcement = "warn"

[extends]
domain_repo    = ""
kernel_version = "0.3.0"

[layers]
kernel      = [
  "CONSTITUTION.md",
  "engine/workos.py",
]
golden_path = [
  "engine/validate.py",
  "engine/scan.py",
  "engine/fleet.py",
  "engine/intent.py",
  "engine/inbox.py",
  "engine/catalog.py",
  "engine/generators.py",
  "engine/abstraction_gate.py",
  "engine/release_gate.py",
  "engine/deliverable_gate.py",
  "engine/audit.py",
  "engine/adopt.py",
  "engine/promote.py",
  "engine/promotion.py",
  "engine/render.py",
  "hooks/claude_guard.py",
  "hooks/kernel_watch.py",
  "hooks/branch_guard.py",
  "hooks/sweep_guard.py",
  "hooks/fleet_watch.sh",
  "templates",
  "tests/test_guards.py",
  "tests/test_release_gate.py",
  "tests/test_deliverable_gate.py",
  "tests/test_audit.py",
]
# config 層は別リポジトリ（work-os-registry）にある。組織固有の事実を
# 本体の履歴に残さないため 2026-08-31 に切り出した。所在は engine/workos.py の
# registry_root() が決める（WORKOS_REGISTRY → ../work-os-registry → 同居時の位置）。
config      = []
extension   = []

# 公開意図。統治クラス（owned/team/...）とは直交する軸なので別に宣言する。
# ここを書いたリポジトリだけが engine/release_gate.py の対象になる。
[publish]
# intent は **目標** を書く欄であって、現在地を書く欄ではない。累積ラダーが
# 「今どこまで到達しているか」を出すので、目標を下げると到達点の表示が消える。
#
# work-os の目標は public。第2段を止めていた顧客名 276件（12社）は、初回コミット
# から履歴に入っていたため削除では届かず、2026-08-31 に registry/ を別リポへ
# 切り出したうえで履歴からも消した（filter-repo）。現在地は release_gate が出す。
#
# 2026-08-27 に一度 internal へ下げたが誤りだった（同日中に戻した）。第2段が
# 誤って OK と出ていたのは intent のせいではなく、顧客名の検査が第1段の warn しか
# 無く、かつ exclude で registry/ が観測から外れていたためである。宣言を下げても
# その2つは直らない。症状を消して機構を放置していた。
#
# 2026-09-15: 公開した。今のリポジトリを public に切り替えるのではなく、
# **新しいリポジトリとして切り出した**。private だった側は work-os-archive へ
# 改名して開発の経緯 78 コミットをそこに残し、作業ツリーだけを 1コミットの
# 新しい履歴として public 側に置いた。切り出した木は archive の HEAD と同じ
# tree（8c54128）である。
#
# 履歴に出せないものは切り出す前から無かった（2026-08-31 の filter-repo 済みで
# no_private_terms_in_history は pass）。それでも切り出したのは、78 コミットの
# 経緯を捨てずに「起点より前が無い」を git の形で示せるからである。
#
# 2026-09-16: 公開後の通読で、**ファイルの中ではなくコミットのメタデータに**
# 法人ドメインのメールアドレスが載っていることが分かり、全コミットの
# author / committer を GitHub の noreply へ書き換えて force-push した。
# したがって「force-push していない」はもう成り立たない（起点の sha も変わり、
# 下の released_at を宣言し直した）。公開から1日で誰も clone していない時点
# だったので選べた手段であり、時間が経つほど選べなくなる種類のものである。
#
# 見つからなかった理由は、走査の範囲が `git log --format=%H%n%B`＝コミット
# メッセージ本文だけで、`%an` `%ae` が入っていなかったこと。
# no_private_terms_in_history が pass と出していたとき、author は一度も
# 見ていなかった。木と本文だけを見て「履歴も pass」と読むのは誤りである。
intent   = "public"
# 形。service（登録のある製品）/ tool / library。agent_ready は service にだけ当たる。
shape    = "tool"
audience = "他社のエンジニアが、自分の組織の git 群に同じ観測層を張るために読む"
exclude  = []   # config 層はこのリポジトリに無い（work-os-registry へ切り出した）

# 公開の起点。ここを宣言すると history_erased の問いが「履歴が1コミットか」から
# 「起点より前が無いか」へ変わり、以後は普通にコミットを積める。走査の側も
# no_private_terms_since_release がここから後だけを見るようになる。
#
# **これは観測ではなく宣言である。** 手元から「本当に公開したのか」は確かめられない
# （private と public の remote は区別できない）。宣言すれば squash を迂回できる
# 代わりに、嘘なら履歴に残る。obs_history_erased の docstring がその分担を書いている。
released_at = "4fa391cb0a5be30833a9ae0f6c6589993d1f6711"

[publish.commands]
test  = "python3 tests/run_all.py"
smoke = "python3 engine/validate.py . && python3 engine/abstraction_gate.py"
help  = "python3 engine/release_gate.py --help"
