# 上の rule のうち機械で引ける部分。個人アカウントの除外は owner_type で掛ける。
[groups.not_adopted.draw]
q = "language:python stars:1..50 archived:false"
sort = "updated"
owner_type = "Organization"
# 1 つの所有者から 1 本まで。updated 順だと、同じ日に何本も更新した組織が群を埋める
# （2026-11-06 の試し引きで 24 本中 6 本が同じ組織だった）。1 つの書き手の癖を
# 6 倍に数えると、群の性質ではなくその組織の性質を測ることになる。
max_per_owner = 1

# --------------------------------------------------------------------------- #
# agent_native — 人が画面を触らずに登録まで到達できると分かっているサービスの CLI
# --------------------------------------------------------------------------- #
# 機械抽出できない（母集団が小さく、star では選べない。cli/cli は 46k、
# railwayapp/cli は 594 で、star とは無関係にどちらも登録動線を CLI に持つ）。
# 手で選んでいることを隠さない。選定の根拠は各 CLI の実装を読んで確かめた事実。
[groups.agent_native]
title = "エージェントが完走できる"
rule = """
登録・認証が CLI のサブコマンドにあり、デバイスコードか PKCE でフォームを介さず、
ブラウザを開けない環境の逃げ道を持つことを実装で確認したもの。手で選んでいる。
star とは相関しない（46000 のものと 594 のものが同じ性質を持つ）。
"""
shape = "service"
slugs = [
  "superfly/flyctl",
  "stripe/stripe-cli",
  "cli/cli",
  "railwayapp/cli",
  "supabase/cli",
  "vercel/vercel",
]


# --------------------------------------------------------------------------- #
# landmark — 落としたら、間違っているのはゲートの側
# --------------------------------------------------------------------------- #
# 統計ではなくカナリア。数が少ないので通過率を比較には使わない。
# 「誰が見ても他人の手に渡っているもの」を落とすなら、その物差しは壊れている、
# という背理のために置く。各群の通過率より、こちらのほうが早く異常に気づける。
[groups.landmark]
title = "落としてはいけないもの"
rule = """
規模と採用が疑いようのないリポジトリ。star の閾値ではなく「これを公開不可と
言い切れるか」で選ぶ。ここが落ちたら、まず落とした検査のほうを疑うこと。
manifest_required は課さない（配布物がリポジトリの外にある形も含めるため）。
"""
shape = "tool"
skip_filters = true
# 通過率の比較に使わない群。件数の下限を課さない（背理のための例示なので）。
canary = true
slugs = [
  "NousResearch/hermes-agent",
  "anthropics/claude-code",
]


# --------------------------------------------------------------------------- #
# formal — 形式証明を公開している組織の Lean リポジトリ
# --------------------------------------------------------------------------- #
# 公開済み＝「出してよい」の正解ラベル。star では選ばない。数学の証明成果物と、
# 形式検証のフレームワーク・参照ノートが混ざる。ここを第1段で止めたら、それは
# 「出した瞬間に取り返しがつかないものがある」と言ったことになるので、1件ずつ実物を見る。
[groups.formal]
title = "形式証明を公開している"
rule = """
gh search repos --owner openai --language Lean と --owner NyxFoundation --language Lean
から、fork でも archive でもないものを全部取る（2026-10-28 に実行）。star では選ばない。
"""
shape = "tool"
# openai/math は論文の PDF と組版ソースを含めて作業ツリーが 3.6GB ある。
# 既定の 400MB では測らずに除外されるので、この群だけ上限を上げる。
max_clone_mb = 5000
slugs = [
  "openai/math",
  "openai/NavierStokesAndEuler",
  "openai/ten-proofs",
  "openai/PrimeGaps186",
  "openai/LongGapsBetweenPrimes",
  "openai/cdc-lean",
  "NyxFoundation/nyxis",
  "NyxFoundation/docs2formalspec",
  "NyxFoundation/tsl-formal-verification",
  "NyxFoundation/formal-leanSpec",
  "NyxFoundation/verity-aeneas-proofs",
  "NyxFoundation/minimmit-fv",
  "NyxFoundation/consensus-ffi-poc",
  "NyxFoundation/cl-asm",
  "NyxFoundation/leanSSZ",
  "NyxFoundation/consensus-sim",
  "NyxFoundation/simplex-fv",
  "NyxFoundation/nyx-ssz",
  "NyxFoundation/rlmd-ghost-fv",
  "NyxFoundation/lean4-client-proto",
  "NyxFoundation/goldfish-fv",
  "NyxFoundation/lean4-speedup",
  "NyxFoundation/eth-total-supply-safety",
]


# --------------------------------------------------------------------------- #
# 対象から外す条件
# --------------------------------------------------------------------------- #
[filters]
# 「動かすもの」であることの機械的な条件。1つでも在れば通す。
# これを持たないリポは install も test も無くて当然なので、測っても何も分からない。
manifest_required = [
  "pyproject.toml", "setup.py", "setup.cfg", "package.json",
  "go.mod", "Cargo.toml", "pom.xml", "build.gradle", "Gemfile", "composer.json",
  "lakefile.lean", "lakefile.toml",
]
# clone の上限。超えるものは測らずに除外し、結果に理由付きで残す（黙って落とさない）。
max_clone_mb = 400


# --------------------------------------------------------------------------- #
# 閾値が「分けている」と言える条件
# --------------------------------------------------------------------------- #
# 差が小さいチェックは、落とす根拠にしてはいけない（warn に留めるか、消す）。
# ここも宣言にしておく。数字を後から動かしたくなったら、動かした事実が diff に残る。
[separation]
# adopted の通過率 - not_adopted の通過率。これ以上あれば「分けている」と呼ぶ。
min_gap = 0.40
# agent_ready レーンは agent_native と not_adopted を比べる。
agent_lane_min_gap = 0.50
