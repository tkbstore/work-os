# corpus.toml — レーンの閾値を裏づける観測対象。config 層。
#
# なぜ在るか
#   config/release_lanes.toml の閾値（within_ratio = 0.30 など）は「高star と
#   低star を実測して分けた」という主張の上に立っている。その主張を再現できなければ、
#   閾値はただの好みになる。憲法 §1 は証拠で上げると決めているので、証拠の側を固定する。
#
# どう使うか
#   python3 engine/calibrate.py            観測して結果を書き出す
#   python3 engine/calibrate.py --dry-run  clone せず、宣言だけを検査する
#
# 何を測らないか
#   command_exit_zero 系（test_passes / tutorial_runs / help_available）は測らない。
#   他所のリポのコマンドを実行することになるので、校正では必ず skip 扱いになる。
#   ここで分かるのは「静的に観測できるチェックが群を分けているか」だけである。
#
# 選び方を宣言する理由
#   後から「なぜこの12本なのか」と聞かれて答えられない選択は、証拠ではなく作為になる。
#   下の rule は、同じ手順で別の人が別の母集団を引ける粒度で書くこと。

[corpus]
frozen_on = "2026-11-06"
# 2026-08-26 の凍結結果は results/2026-08-26.json に残してある。群を足したので日付を進めた
# （同じ日付で書くと前回の結果を上書きしてしまう）。
# star 数は凍結時点の値。変動するので、判定には使わず記録だけする。
note = "star 数は frozen_on 時点。再測定するときは slug を差し替えず、まず同じ集合で測る"


# --------------------------------------------------------------------------- #
# adopted — 広く採られたソフトウェア
# --------------------------------------------------------------------------- #
[groups.adopted]
title = "採られた"
rule = """
GitHub の star 降順（language:python, stars:>30000）から上位を取り、
「動かすもの」だけを残す。リンク集・書籍・チュートリアル集は、install も test も
存在しないのが正しい形なので対象外（この物差しが測れる対象ではない）。
機械的な条件は manifest_required の通り。
"""
shape = "tool"
# この群は calibration/upstream.toml の [reference_corpus] で基準のリポにもなる。基準は
# 全部が全段に届くことを求めるので、測れないまま置けない。既定の 400MB では
# Significant-Gravitas/AutoGPT（498MB）が測られずに外れていた（2026-11-06）。
max_clone_mb = 1000
slugs = [
  "psf/requests",
  "fastapi/fastapi",
  "django/django",
  "astral-sh/ruff",
  "yt-dlp/yt-dlp",
  "openai/whisper",
  "3b1b/manim",
  "nvbn/thefuck",
  "sherlock-project/sherlock",
  "home-assistant/core",
  "vinta/awesome-python",  # 2026-11-06 に draw で引いた
  "TheAlgorithms/Python",  # 2026-11-06 に draw で引いた
  "microsoft/markitdown",  # 2026-11-06 に draw で引いた
  "Significant-Gravitas/AutoGPT",  # 2026-11-06 に draw で引いた
  "huggingface/transformers",  # 2026-11-06 に draw で引いた
  "AUTOMATIC1111/stable-diffusion-webui",  # 2026-11-06 に draw で引いた
  "langgenius/dify",  # 2026-11-06 に draw で引いた
  "langflow-ai/langflow",  # 2026-11-06 に draw で引いた
  "langchain-ai/langchain",  # 2026-11-06 に draw で引いた
  "github/spec-kit",  # 2026-11-06 に draw で引いた
  "nextlevelbuilder/ui-ux-pro-max-skill",  # 2026-11-06 に draw で引いた
  "Comfy-Org/ComfyUI",  # 2026-11-06 に draw で引いた
  "Shubhamsaboo/awesome-llm-apps",  # 2026-11-06 に draw で引いた
  "Graphify-Labs/graphify",  # 2026-11-06 に draw で引いた
  "ytdl-org/youtube-dl",  # 2026-11-06 に draw で引いた
  "harry0703/MoneyPrinterTurbo",  # 2026-11-06 に draw で引いた
  "TauricResearch/TradingAgents",  # 2026-11-06 に draw で引いた
  "browser-use/browser-use",  # 2026-11-06 に draw で引いた
  "Panniantong/Agent-Reach",  # 2026-11-06 に draw で引いた
  "pytorch/pytorch",  # 2026-11-06 に draw で引いた
]
# 上の rule のうち機械で引ける部分。engine/sample_corpus.py がこれを実行して足す。
# 「動かすもの」の足切り（manifest_required）は測るときに calibrate.py が掛ける。
[groups.adopted.draw]
q = "language:python stars:>30000 archived:false"
sort = "stars"
owner_type = ""

# --------------------------------------------------------------------------- #
# not_adopted — 同じくソフトウェアだが、採られていない
# --------------------------------------------------------------------------- #
# 個人アカウントのリポジトリは入れない。趣味の作品を「悪い例」として名指しで
# 公開層に載せないため。組織所有だけに絞ると母集団は小さくなるが、それは正しい制約。
[groups.not_adopted]
title = "採られていない"
rule = """
language:python, stars:1..50, sort:updated から Organization 所有のみを残し、
adopted と同じ manifest_required を課す。個人アカウントは除外する
（趣味の作品を悪い例として名指ししないため）。
"""
