  "HarvardMadSys/hybridInference",  # 2026-11-06 に draw で引いた
  "akvo/drought-map-hub",  # 2026-11-06 に draw で引いた
  "awslabs/unified-kg-rag-on-aws",  # 2026-11-06 に draw で引いた
  "GMISWE/tinker-cloud",  # 2026-11-06 に draw で引いた
