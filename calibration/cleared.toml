# cleared.toml — 基準のリポで当たった値のうち、人が実物を見て「秘密ではない」と判定したもの。
#
# 形は registry の audit.toml と同じで、校正（engine/calibrate.py）だけが読む。本番の
# ゲートの既定は変えない。値の形では本物の秘密と分けられないものを、形で緩めずに
# 1件ずつ通すための記録である。どの組織も同じ仕組み（auditable）で同じことができる。
#
# 鍵は行の本文のハッシュ（line_key）。行の中身が変われば失効し、また止まる。
# 1件が抑制できるのは1つの (repo, path, declaration, line_key) だけ。
# 確かめられない値は記録しない。記録が無ければ止まったままになる。
# 書き足すときは engine/audit.py --log calibration/cleared.toml --clear を使う。
# 記録を変えるとゲートの指紋が変わるので、upstream_audit.py --recheck --write で測り直す。

