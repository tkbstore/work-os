path = "apps/cli/docs/templates/examples.yaml"
declaration = "jwt"
line_key = "e7b5daf3a9389292"
verdict = "cleared"
why = "ローカル開発用の demo JWT。iss=supabase-demo で、同じファイルに載る既定の JWT secret（super-secret-jwt-token-with-at-least-32-characters-long）で署名が通ることを確かめた。誰でも知っている鍵で署名された値で、何の権限も漏らさない"
who = "claude-opus-5-5（方針は TK が 2026-11-02 に承認。値ごとの確認は PR で）"
when = "2026-11-02"
excerpt = "anon key: eyJh….eyJp…."

