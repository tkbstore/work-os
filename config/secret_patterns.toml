# secret_patterns.toml — 出た時点で漏洩が確定する形。config 層。
#
# 出典: ~/.claude/agents/opensource-sanitizer.md（公開直前に LLM が回す監査）。
# あちらは1リポを深く1回。こちらは全リポを毎日、決定論で。同じ形を二重に張る。
# 新しい形が見つかったらここに1行足す。engine は正規表現の中身を知らない。
#
# 値はすべて TOML の *リテラル文字列*（シングルクォート）で書くこと。
# 基本文字列（ダブルクォート）だと \s を \\s と二重に書く必要があり、
# 実運用の Python 3.9 fallback パーサと 3.11+ の tomllib で解釈が食い違う。
# 実際にそれで robustness レーンが黙って素通りした。だからリテラル固定。
# リテラル中にシングルクォートは書けないので、正規表現側の \x27 で表す。

[patterns]
# 変数名が api_key であることは秘密の証拠ではない。秘密かどうかは *値* が決める。
# 埋めてもらうための見本（YOUR_..., <...>, CHANGE_ME, ALL_CAPS_WITH_UNDERSCORES）は
# 置かれていること自体が作法であって漏洩ではない。実測: Movie-generator-local の
# config.yaml に在ったのはコメントアウトされた "YOUR_ELEVENLABS_API_KEY" だった。
#
# 小文字の識別子（anthropic_api_key, managed-bedrock-api-key）も秘密ではない。
# 秘密は乱数であって語ではない。実測: langchain は api_key_field="anthropic_api_key"
# という **フィールド名の文字列** で、codex はテスト用ヘルパの偽値で落ちていた。
api_key        = '[A-Za-z0-9_]*(api[_-]?key|apikey|api[_-]?secret)[A-Za-z0-9_]*\s*[=:]\s*[\x27"](?!(your|xxx+|change|example|sample|placeholder|todo|replace|insert|dummy|test)[_-]?)(?![A-Z]+(_[A-Z]+)+[\x27"])(?![a-z]+([_-][a-z0-9]+)+[\x27"])[A-Za-z0-9+/=_-]{16,}'
aws_access_key = 'AKIA[0-9A-Z]{16}'
aws_secret     = '(?i)(aws_secret_access_key|aws_secret)\s*[=:]\s*[\x27"]?[A-Za-z0-9+/=]{20,}'
# 資格情報が危ないのは、それが *他所から届くホスト* に対して通用するときだけ。
# docker-compose のサービス名（@db）や localhost に向いた既定値は、外に持ち出しても
# 誰も何もできない。到達性を「ホスト名にドットがあるか」で見る。名前解決がその
# ネットワークの中でしか効かないホストは、公開しても資格情報として機能しない。
# 実測: これで3リポにまたがる5件の誤検出が消え、
# 本物（*.supabase.co のような FQDN 付き）は残る。
db_url_creds   = '(postgres|postgresql|mysql|mongodb|redis)://[^:/\s]+:[^@\s]+@(?!127\.0\.0\.1|0\.0\.0\.0)[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)+'
jwt            = 'eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+'
# 見出しだけでは鍵ではない。鍵は本体があって初めて鍵である。
# 見出しの直後に改行と base64 の塊が続くことを要求する。これで「秘密を扱うコード」
# （正規表現・解説コメント・秘匿処理の実装）と「秘密が漏れているコード」が分かれる。
# 実測: hermes-agent (236k star) は agent/redact.py の **コメント** で落ちていた。
# 秘匿処理のライブラリが秘匿対象の形を書けないというのは、明らかに物差しの側の誤り。
private_key    = '-----BEGIN\s*[A-Z ]*PRIVATE KEY-----[ \t]*\r?\n[A-Za-z0-9+/=\s]{100,}'
github_token   = 'gh[pousr]_[A-Za-z0-9_]{36,}'
github_pat     = 'github_pat_[A-Za-z0-9_]{22,}'
# 接頭辞だけでは足りない。本物の client secret は 28 文字前後あり、伏せ字（xxxxx）は
# 短い。長さの下限と「伏せ字だけではない」を足す。実測: 4リポの docs に在った
# GOCSPX-xxxxx はすべて手順書の穴埋め見本だった。
google_oauth   = 'GOCSPX-(?![xX]+\b)[A-Za-z0-9_-]{20,}'
slack_webhook  = 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
# 接頭辞だけでは足りない。本物は xoxb-<数字>-<数字>-<ランダム> の形をしている。
# 実測: openclaw の QA シナリオと e2e スクリプトに在ったのは
# xoxb-intentionally-invalid-lifecycle のような、小文字と - だけの偽値だった。
# 置き場（qa/ や scripts/e2e/）を列挙するのではなく、値の形で分ける。
slack_token    = 'xox[baprs]-[0-9]{9,}-[0-9]{9,}-[A-Za-z0-9]{20,}'
sendgrid       = 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
mailgun        = 'key-[a-f0-9]{32}'
stripe_live    = 'sk_live_[A-Za-z0-9]{24,}'
openai         = 'sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
anthropic      = 'sk-ant-[A-Za-z0-9_-]{24,}'
