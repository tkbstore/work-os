# patch_smells.toml — 「症状を隠した」ことの機械的な痕跡。config 層。
#
# 根本原因を直したかどうかを機械は判定できない。判定できるのは
# **原因に触れずに症状だけを消す操作には決まった形がある**ということだけである。
# ここはその形の一覧で、hooks/root_cause_guard.py は中身を知らない。
#
# 禁止ではない。抑制が正しい場面は実在する（生成コード、外部由来の警告、
# 意図的に壊した fixture）。要求しているのは **同じ場所に理由を書くこと** だけ。
# 理由が書けないなら、消しているのは報告のほうで、原因はまだ在る。
#
# 値は TOML の *リテラル文字列*（シングルクォート）で書くこと。理由は
# registry/secret_patterns.toml の先頭に書いてある（3.9 fallback との解釈差）。

# --------------------------------------------------------------------------- #
# [line] 行そのものが痕跡になるもの。新しく現れた行だけを見る。
# --------------------------------------------------------------------------- #
[line.suppression]
# 検査を黙らせる注記。原因ではなく報告のほうを消している。
noqa           = '#\s*noqa'
type_ignore    = '#\s*type:\s*ignore'
pylint_disable = '#\s*pylint:\s*disable'
no_cover       = '#\s*pragma:\s*no\s*cover'
eslint_disable = 'eslint-disable(-next-line|-line)?'
ts_ignore      = '@ts-(ignore|expect-error)'
rust_allow     = '#!?\[allow\('
java_suppress  = '@SuppressWarnings'
go_lint        = '//\s*nolint'

[line.disabled_test]
# テストのほうを黙らせる。落ちているのは実装かもしれない。
py_skip     = '@(unittest\.)?skip\b|pytest\.mark\.(skip|xfail)'
js_skip     = '\b(describe|it|test)\.(skip|todo)\b'
js_only     = '\b(describe|it|test)\.only\b'
go_skip     = 't\.Skip\('
rust_ignore = '#\[ignore\]'

# --------------------------------------------------------------------------- #
# [change] 行の形では分からず、変更の *向き* を見て初めて分かるもの。
# 新しく `timeout = 30` と書くのは場当たりではない。既にある 30 を 300 に
# 動かして緑にするのが場当たりである。だから前後を比べる。
# --------------------------------------------------------------------------- #
[change.threshold]
# 観測を変えずに合格線だけ動かす。緑になるのは基準が下がったからである。
# key に当たる名前と、緩む向き（up = 大きくすると緩む / down = 小さくすると緩む）。
keys_up   = '(?i)\b([a-z_]*(?:max|limit|timeout|retries|tolerance|budget)[a-z_]*)\s*[=:]\s*'
keys_down = '(?i)\b([a-z_]*(?:min|minimum|coverage|required|threshold)[a-z_]*)\s*[=:]\s*'

[change.widening]
# 列挙に「もう1つ足す」形。列挙で逃がすと、列挙しなかった場所が黙って素通りする。
# 実測: release_gate の絶対パス検査が拡張子5個の列挙だったため、実際に含んでいた
# 23 リポジトリのうち 16 を pass にしていた（見逃し 70%）。
#
# ここを最初 exclude / ignore / skip ... という **変数名の列挙** で書いていた。
# それは上の失敗とまったく同じ形の誤りで、globs / patterns / lanes / sources
# といった名前が永久に見えなくなる。名前ではなく **変更の形** で見る。
# 「既にある括弧の中身が項目だけ増えて、他が変わっていない」は名前を知らなくても
# 判定できる。足すこと自体は禁止しない。「なぜ一般化できないのか」を書かせる。
opener = '[\[(]'
item   = '^\s*[\x27"][^\x27"]+[\x27"]\s*,?\s*$'
# 形だけで見ると、依存の追加もプロンプトデータの追加も同じ形に見える。
# 実測（ハンク 5920 件）で当たった9件のうち、実際に「検査から逃がす列挙」だったのは
# pyproject.toml 等のマニフェスト名の列挙と、許可リストへの追加だけだった。
# 残りは "pytest-timeout>=2.4.0" のような依存と、日本語のプロンプト文だった。
# 名前には戻らず、**項目の形**で絞る。逃がすための項目はパス・glob・識別子の形をしていて、
# バージョン指定子も自然文も含まない。
not_exemption = '(>=|<=|==|~=|\^|CJK)'
prose         = '[\u3040-\u30ff\u4e00-\u9fff]|\s'

