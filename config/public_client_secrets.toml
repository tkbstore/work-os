# public_client_secrets.toml — 公開されうる「秘密の名を持つ値」。config 層。
#
# なぜ secret_patterns.toml と分けるか
#   Google の OAuth client secret（GOCSPX-）は、インストール型アプリでは
#   ソースに埋め込むものとして Google 自身が文書化している（「この文脈では
#   client secret は明らかに秘密として扱われない」
#   https://developers.google.com/identity/protocols/oauth2#installed ）。
#   基準のリポ google-gemini/gemini-cli はそのとおりに公開しており、block の
#   秘密パターンに入れていた頃は内部の段で止めていた（2026-10-31）。
#   一方、Web アプリの client secret は同じ形で、本当に秘密である。形では
#   分けられないので、止めずに目で見させる（release_lanes.toml の
#   safety.no_public_client_secrets、warn）。
#
# 書き方は secret_patterns.toml と同じ（リテラル文字列で書く）。

[patterns]
# 接頭辞だけでは足りない。本物の client secret は 28 文字前後あり、伏せ字（xxxxx）は
# 短い。長さの下限と「伏せ字だけではない」を足す。実測: 4リポの docs に在った
# GOCSPX-xxxxx はすべて手順書の穴埋め見本だった。
google_oauth   = 'GOCSPX-(?![xX]+\b)[A-Za-z0-9_-]{20,}'
